# cargo-about's settings for the license texts every release archive, wheel and source package
# carries (ADR-114, ADR-187): `scripts/release/licenses.sh` writes THIRD-PARTY-LICENSES.txt with them.
# Written for cargo-about 0.9.2, the version release.yml installs. The accepted licenses are
# deny.toml's allow list; `cargo test -p xtask` keeps the two equal.
accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# The platforms the release workflow builds on; a dependency only another platform links is left out.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
# Tests and benchmarks aren't shipped. Build scripts and derive macros are kept: they shape the
# code that is, and listing them costs nothing.
ignore-dev-dependencies = true
ignore-build-dependencies = false
