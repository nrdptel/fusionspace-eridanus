# The documentation site (ADR-016). `cargo xtask site` builds it with mdBook 0.5 and checks it.
# Its source is `docs/` itself: `docs/SUMMARY.md` lists the pages, and every other file there
# (STATUS, ROADMAP, DECISIONS, research notes) is linked from the site on GitHub, not rendered.

[book]
title = "FusionSpace HPR"
description = "An open-source flight simulator for hobby and high-power rockets: its models, sources and validation."
language = "en"
src = "docs"

[build]
build-dir = "target/site"
# A page the summary lists must exist; don't create an empty one.
create-missing = false

[output.html]
# Where GitHub Pages serves the site (ADR-019): the root of its custom domain,
# `hpr.fusionspace.co` (ADR-199). mdBook's 404 page, which works at any address, links the rest of
# the site under this path.
site-url = "/"
git-repository-url = "https://github.com/nrdptel/fusionspace-eridanus"
edit-url-template = "https://github.com/nrdptel/fusionspace-eridanus/edit/main/{path}"
# The FusionSpace product system's mdBook theme and fonts, from `theme/` (ADR-164): light by
# default, navy for a reader whose system is dark. `theme/fonts/fonts.css` replaces mdBook's own
# fonts, so every font is served from the site. mdBook would rename the copied files with a hash
# and leave `fonts.css`'s addresses pointing at the old names, so hashing is off.
default-theme = "light"
preferred-dark-theme = "navy"
additional-css = ["theme/fusionspace-mdbook.css", "theme/hpr.css"]
# `theme/hpr.js` takes the menu bar title's click before mdBook's script scrolls smoothly (#383);
# `theme/head.hbs` adds the color scheme and the browser bar's colors to every page's head.
additional-js = ["theme/hpr.js"]
hash-files = false

# Code blocks are quotes and output, not Rust to run in the playground.
[output.html.playground]
runnable = false

# Search lands on a page's `##` section, which holds its `###` and `####` ones, and every page is
# in the index. mdBook 0.5.4 writes the index with each field holding the words of the fields
# before it, so `cargo xtask site` rebuilds it with each field's words alone (#414,
# `xtask/src/site/search.rs`) and holds the rebuilt file to what main's file weighed before it,
# measured the same way: 1,675,059 bytes compressed with gzip (GitHub Pages sent 1,754,850), at
# b7313b32, with fifteen pages left out of search to stay under mdBook's 10 MB warning. Rebuilt,
# with all of them in, it is 7.72 MB, about 1.60 MB compressed. Landing on the `###` section or
# the `####` one (about 1.73 MB and 1.77 MB, measured the same way) would cost a reader more than
# before, so the split stays at `##`. No page is left out of search (a test in `search.rs` fails
# on an `[output.html.search.chapter]` table).
[output.html.search]
heading-split-level = 2

# The equations (`xtask/src/site/math.rs`): each `$…$` and `$$…$$` becomes MathML before mdBook
# renders the page, so the browser draws it in the math face with no script. `cargo xtask site`
# runs the build's own xtask in place of this command; `mdbook serve` runs this one.
[preprocessor.math]
command = "cargo xtask site-math"
