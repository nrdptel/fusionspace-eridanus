# The documentation site (ADR-016). `cargo xtask site` builds it with mdBook 0.5 and checks it.
# Its source is `docs/` itself: `docs/SUMMARY.md` lists the pages, and every other file there
# (STATUS, ROADMAP, DECISIONS, research notes) is linked from the site on GitHub, not rendered.

[book]
title = "FusionSpace HPR"
description = "An open-source flight simulator for hobby and high-power rockets: its models, sources and validation."
language = "en"
src = "docs"

[build]
build-dir = "target/site"
# A page the summary lists must exist; don't create an empty one.
create-missing = false

[output.html]
# Where GitHub Pages serves the site (ADR-019): the root of its custom domain,
# `hpr.fusionspace.co` (ADR-199). mdBook's 404 page, which works at any address, links the rest of
# the site under this path.
site-url = "/"
git-repository-url = "https://github.com/nrdptel/fusionspace-eridanus"
edit-url-template = "https://github.com/nrdptel/fusionspace-eridanus/edit/main/{path}"
# The FusionSpace product system's mdBook theme and fonts, from `theme/` (ADR-164): light by
# default, navy for a reader whose system is dark. `theme/fonts/fonts.css` replaces mdBook's own
# fonts, so every font is served from the site. mdBook would rename the copied files with a hash
# and leave `fonts.css`'s addresses pointing at the old names, so hashing is off.
default-theme = "light"
preferred-dark-theme = "navy"
additional-css = ["theme/fusionspace-mdbook.css", "theme/hpr.css"]
# `theme/hpr.js` takes the menu bar title's click before mdBook's script scrolls smoothly (#383);
# `theme/head.hbs` adds the color scheme and the browser bar's colors to every page's head.
additional-js = ["theme/hpr.js"]
hash-files = false

# Code blocks are quotes and output, not Rust to run in the playground.
[output.html.playground]
runnable = false

# The physics pages are long, and their answers live under `###` and `####` headings. A search
# landed on the `###` section: splitting at `####` too put the index 26 KB past mdBook's 10 MB
# warning once M0.9c16 gave every figure on the model pages its US units (10.03 MB, against
# 9.91 MB split at `###`). It passed again in M7.1c14, at 10.02 MB, with the Excel workbooks'
# section, and every page left in the index was one a reader needs; so a search now lands on the
# `##` section, which holds the `###` ones (9.06 MB; 1.49 MB as gzip sends it). Every page stays
# in the index; #414 is the lasting fix, after which the split can go back to `####`.
[output.html.search]
heading-split-level = 2

# The search index passed mdBook's 10 MB warning in M2.3c1. The records page, generated by `cargo
# xtask records`, is 195 KB of tables of milestones and decision summaries, each linking to a page
# the index holds or to a record on GitHub; left out of the index, it is still reached from every
# page's links and found with the browser's own search. It passed again in M0.9c12, at 10.00 MB:
# the two pages for the project's own contributors, the house style (`writing.md`) and how a
# release is built (`releasing.md`), are left out too (9.92 MB after), each still in the sidebar
# and linked from the start page. A lasting fix is #414. It passed once more in M0.8a3, at
# 10.02 MB, with the simulator's comparison page: the validation plan (`VALIDATION.md`), the
# maintainers' inventory of references and test layers, is left out too, still in the sidebar and
# linked from *Accuracy* and *Checking a claim*, whose reader-facing answers the index keeps.
# And in M7.1c9, at 10.03 MB, with the AltOS telemetry section: the release plan (`plan.md`), what
# each release will hold, is left out too, still in the sidebar and linked from the start page.
# And in M7.1c12, at 10.01 MB, with the RTx tracker's section: the API reference's landing page
# (`api.md`), a table of the crates whose own pages, built by rustdoc, hold the API and its search,
# is left out too, still in the sidebar and linked from the start page.
# And in M7.2d, at 10.02 MB, with the smoother's page: the evidence register (`evidence.md`),
# whose rows restate the gaps the guide's pages state, each of which links its row, is left out
# too (9.87 MB after), as the evidence check leaves it out of the pages it reads for the same
# reason; it is still in the sidebar and linked from every gap.
[output.html.search.chapter]
"decisions-and-roadmap.md" = { enable = false }
"writing.md" = { enable = false }
"releasing.md" = { enable = false }
"VALIDATION.md" = { enable = false }
"plan.md" = { enable = false }
"api.md" = { enable = false }
"evidence.md" = { enable = false }

# The equations (`xtask/src/site/math.rs`): each `$…$` and `$$…$$` becomes MathML before mdBook
# renders the page, so the browser draws it in the math face with no script. `cargo xtask site`
# runs the build's own xtask in place of this command; `mdbook serve` runs this one.
[preprocessor.math]
command = "cargo xtask site-math"
