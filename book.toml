# The documentation site (ADR-016). `cargo xtask site` builds it with mdBook 0.5 and checks it.
# Its source is `docs/` itself: `docs/SUMMARY.md` lists the pages, and every other file there
# (STATUS, ROADMAP, DECISIONS, research notes) is linked from the site on GitHub, not rendered.

[book]
title = "FusionSpace HPR"
description = "An open-source flight simulator for hobby and high-power rockets: its models, sources and validation."
language = "en"
src = "docs"

[build]
build-dir = "target/site"
# A page the summary lists must exist; don't create an empty one.
create-missing = false

[output.html]
# Where GitHub Pages serves the site (ADR-019): the root of its custom domain,
# `hpr.fusionspace.co` (ADR-199). mdBook's 404 page, which works at any address, links the rest of
# the site under this path.
site-url = "/"
git-repository-url = "https://github.com/nrdptel/fusionspace-eridanus"
edit-url-template = "https://github.com/nrdptel/fusionspace-eridanus/edit/main/{path}"
# The FusionSpace product system's mdBook theme and fonts, from `theme/` (ADR-164): light by
# default, navy for a reader whose system is dark. `theme/fonts/fonts.css` replaces mdBook's own
# fonts, so every font is served from the site. mdBook would rename the copied files with a hash
# and leave `fonts.css`'s addresses pointing at the old names, so hashing is off.
default-theme = "light"
preferred-dark-theme = "navy"
additional-css = ["theme/fusionspace-mdbook.css", "theme/hpr.css"]
hash-files = false

# Code blocks are quotes and output, not Rust to run in the playground.
[output.html.playground]
runnable = false

# The physics pages are long, and their answers live under `####` headings (a single model, a
# single check). Index those too, so a search lands on the subsection instead of the page.
[output.html.search]
heading-split-level = 4

# The search index passed mdBook's 10 MB warning in M2.3c1. The records page, generated by `cargo
# xtask records`, is 195 KB of tables of milestones and decision summaries, each linking to a page
# the index holds or to a record on GitHub; left out of the index, it is still reached from every
# page's links and found with the browser's own search. It passed again in M0.9c12, at 10.00 MB:
# the two pages for the project's own contributors, the house style (`writing.md`) and how a
# release is built (`releasing.md`), are left out too (9.92 MB after), each still in the sidebar
# and linked from the start page. A lasting fix is #414.
[output.html.search.chapter]
"decisions-and-roadmap.md" = { enable = false }
"writing.md" = { enable = false }
"releasing.md" = { enable = false }
