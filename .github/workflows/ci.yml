name: CI

# Runs on every pull request, with no path filters, so docs-only PRs also get checks to merge on;
# the `scope` job says which checks a run needs. Each night, and when started by hand with `full`,
# it runs on main with every check, the flight censuses too (ADR-149, amended).
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 08:17 UTC, the small hours in the US, off the hour, when GitHub's scheduled runs bunch up.
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: Run every check, the flight censuses too, as the nightly run does
        type: boolean
        default: false

concurrency:
  # The nightly and hand-started full runs queue apart from the same branch's other runs, so a push
  # to main neither waits behind a census nor cancels one.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'schedule' || inputs.full) && 'full' || 'checks' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Line tables only: panics and backtraces keep their file and line, and the link step has less to
  # write. Optimization, debug assertions and overflow checks are untouched, so every number a test
  # compares comes out the same.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # Which checks this run needs (ADR-149, amended). `full` is true on the nightly run and on a run
  # started by hand with `full`: only then do the flight censuses run whole (the `census` job on
  # every platform, the `fit` jobs on Linux). A pull request or a push to main flies the slices of
  # the synthetic flights and two logs (`validate`) and leaves the whole to that night's run, as
  # `scripts/gate.sh` does on the Mac, which still runs the fit whole. `notes` is true
  # when every file a pull request or push changes, renamed from or to, is a research note under
  # docs/research/: `validate`, `examples` and `python` then run no step and pass, and `types`,
  # `wasm-check` and `phone` skip, each still reporting by name for branch protection. `test` and
  # `site`, which read the notes, run, and so do the quick Linux checks. A list GitHub can't give,
  # an empty one, or one of 300 files or more (the compare API's cap) counts as code.
  scope:
    name: scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      full: ${{ steps.scope.outputs.full }}
      notes: ${{ steps.scope.outputs.notes }}
    steps:
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          FULL: ${{ inputs.full }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          full=false
          if [[ $EVENT == schedule || ( $EVENT == workflow_dispatch && $FULL == true ) ]]; then
            full=true
          fi
          # The files of the commits this run checks: a pull request's head against its base, or
          # a push against the commit before it.
          from="" to=""
          if [[ $EVENT == pull_request ]]; then
            from=$BASE to=$HEAD
          elif [[ $EVENT == push && -n $BEFORE && ! $BEFORE =~ ^0+$ ]]; then
            from=$BEFORE to=$GITHUB_SHA
          fi
          files=""
          if [[ -n $from ]]; then
            files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$from...$to" \
              --jq '.files[] | .filename, (.previous_filename // empty)') || files=""
          fi
          count=$(grep -c . <<<"$files" || true)
          notes=false
          if (( count > 0 && count < 300 )) && ! grep -qv '^docs/research/' <<<"$files"; then
            notes=true
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"
          echo "full=$full, notes=$notes: $count changed paths"

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rustup installs the toolchain, components and targets pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main saves: pull requests restore main's cache, and the repository stays under
          # GitHub's 10 GB cache limit instead of evicting main's entries.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  # Every job that runs per OS runs on each platform the releases are built for (ADR-222): Linux
  # and Windows on x86-64 and on 64-bit ARM, and Macs with Apple silicon (Intel Macs wait for
  # issue #438). Their math libraries round some functions differently in the last bit, so each
  # platform is checked, not assumed.
  #
  # The tests run in two halves per OS, side by side: each half builds the workspace and runs
  # every other test (nextest's `count:` partition), so every test still runs once on each OS.
  # The doctests run in the first half.
  test-part:
    name: test (${{ matrix.os }}, ${{ matrix.part }}/2)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
        part: [1, 2]
    runs-on: ${{ matrix.os }}
    env:
      # Warnings that only appear on macOS or Windows fail too (clippy covers Linux).
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: scripts/native-toolchain.sh
        shell: bash
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The design format's generated TypeScript and Python readers run in xtask's tests (M3.3c):
      # Node.js runs TypeScript as it is from 22.18, and the Python needs 3.11.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # nextest runs each test as its own process, in parallel (ADR-149). It doesn't run doctests,
      # so `cargo test --doc` runs in the first half. Together they run what `cargo test` runs.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --all-features --locked --no-fail-fast --partition count:${{ matrix.part }}/2
      - if: matrix.part == 1
        run: cargo test --workspace --all-features --locked --doc

  # The checks branch protection requires are `test (<os>)`: each passes only when both halves
  # passed on every OS, so a failing half shows by name above and fails these too.
  test:
    name: test (${{ matrix.os }})
    needs: test-part
    if: always()
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
    runs-on: ubuntu-latest
    steps:
      - name: Both halves passed
        run: test "${{ needs.test-part.result }}" = success

  # Runs every example program, such as the Getting started page's first flight, and checks that
  # it prints what its committed `<name>.output.txt` says, on each OS. A job of its own, beside
  # test: in test it added up to 10 minutes to CI's slowest job (ADR-149).
  examples:
    name: examples (${{ matrix.os }})
    needs: scope
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: -D warnings
      # No step runs for a change to research notes alone (`scope`).
      RUN: ${{ needs.scope.outputs.notes != 'true' }}
    steps:
      - if: env.RUN == 'true'
        uses: actions/checkout@v7
      - if: env.RUN == 'true'
        run: rustup toolchain install
      - if: env.RUN == 'true'
        run: scripts/native-toolchain.sh
        shell: bash
      - if: env.RUN == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          # Only main saves: pull requests restore main's cache, and the repository stays under
          # GitHub's 10 GB cache limit instead of evicting main's entries.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: env.RUN == 'true'
        run: cargo run --locked --quiet --package xtask -- examples --check --locked

  # Checks every public design's document, written as a literal of the generated `DesignFile`
  # type, with `tsc --strict` and `mypy --strict` at pinned versions (M3.3c, ADR-113). The
  # compilers come from npm and PyPI, so this runs once, on Linux.
  types:
    name: types
    needs: scope
    # Not for a change to research notes alone (`scope`); skipped, it still passes by name.
    if: needs.scope.outputs.notes != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main saves: pull requests restore main's cache, and the repository stays under
          # GitHub's 10 GB cache limit instead of evicting main's entries.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # setup-uv publishes no moving major tag, so it is pinned to a release's commit.
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: cargo run --locked --quiet --package xtask -- format --typecheck
      # Ghost files read back by CesiumJS, Khronos's validator, glTF-Transform and Ajv (M7.2g,
      # ADR-313), pinned by validation/oracles/ghost/package-lock.json. The invented flight only:
      # the gate's refs step holds RocketPy's 22 logs.
      - run: cargo run --locked --quiet --package xtask -- ghost --invented

  # Builds the Python package's abi3 wheel with maturin on each OS and runs its pytest suite on the
  # installed wheel, on CPython 3.10 and 3.13 (M4.3a, scripts/python-tests.sh). The wheels are not
  # kept: a wheel handed out is a binary distribution, which needs its licence texts first (ADR-114).
  python:
    name: python (${{ matrix.os }})
    needs: scope
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    env:
      # The only job that compiles hpr-py (its Rust test binary is off), so its warnings fail here.
      RUSTFLAGS: -D warnings
      # No step runs for a change to research notes alone (`scope`).
      RUN: ${{ needs.scope.outputs.notes != 'true' }}
    steps:
      - if: env.RUN == 'true'
        uses: actions/checkout@v7
      - if: env.RUN == 'true'
        run: rustup toolchain install
      - if: env.RUN == 'true'
        run: scripts/native-toolchain.sh
        shell: bash
      - if: env.RUN == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          # Only main saves: pull requests restore main's cache, and the repository stays under
          # GitHub's 10 GB cache limit instead of evicting main's entries.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The Python maturin builds against: on Windows the abi3 module links its `python3.lib`.
      - if: env.RUN == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # setup-uv publishes no moving major tag, so it is pinned to a release's commit.
      - if: env.RUN == 'true'
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      # CPython's Windows on ARM builds start at 3.11, so there the oldest Python tested is 3.11.
      - if: env.RUN == 'true'
        run: scripts/python-tests.sh ${{ matrix.os == 'windows-11-arm' && '3.11 3.13' || '' }}
        shell: bash

  # Runs every case in the validation lock against its committed reference, with no oracle and no
  # network, and fails if a metric is outside its tolerance or if the committed report is not this
  # run's, to the digits the platforms share (M2.1c1, ADR-015, ADR-022). The references themselves
  # are regenerated only by hand, by the `Regenerate references` workflow.
  validate:
    name: validate (${{ matrix.os }})
    needs: scope
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    env:
      # No step runs for a change to research notes alone (`scope`).
      RUN: ${{ needs.scope.outputs.notes != 'true' }}
    steps:
      - if: env.RUN == 'true'
        uses: actions/checkout@v7
      - if: env.RUN == 'true'
        run: rustup toolchain install
      - if: env.RUN == 'true'
        run: scripts/native-toolchain.sh
        shell: bash
      - if: env.RUN == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          # Only main saves: pull requests restore main's cache, and the repository stays under
          # GitHub's 10 GB cache limit instead of evicting main's entries.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: env.RUN == 'true'
        run: cargo run --locked --quiet --package xtask -- validate --check
      # The motor catalog (M5.7c, ADR-304): the index is what the snapshot's committed files
      # write, every file stored as passing is within 1% of its record, worked out again from its
      # bytes, and none stored as failing is, and every motor flies by name offline.
      - if: env.RUN == 'true'
        run: cargo run --locked --quiet --package xtask --profile report-check -- motor-catalog --check
      # The flight censuses' slices (M0.16a1, ADR-149 amended): every 21st flight of each set of the
      # synthetic flights and of two logs, flown again, held to the census's rules for one flight and
      # to its committed slice in every word, its numbers aside: a flight's last kept digit can move
      # off the Mac's everyday build, where `scripts/gate.sh` holds them byte for byte. The whole
      # censuses run each night (`census`).
      - if: env.RUN == 'true'
        run: cargo run --locked --quiet --package xtask --profile report-check -- synthetic --slice --other-platform
      - if: env.RUN == 'true'
        run: cargo run --locked --quiet --package xtask --profile report-check -- two-logs --slice --other-platform
      # The scoreboard held to main's (M0.10, ADR-240): none of HPR Sim's numbers worse than the
      # one main committed, unless an accepted ADR names it. The checkout holds no main of its own.
      - if: env.RUN == 'true' && matrix.os == 'ubuntu-latest'
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
      - if: env.RUN == 'true' && matrix.os == 'ubuntu-latest'
        run: cargo run --locked --quiet --package xtask -- scoreboard --check --against origin/main
      # The iPhone build (ADR-227) runs here, not in a job of its own, so a run's macOS jobs fit
      # the five GitHub runs at once.
      - if: env.RUN == 'true' && matrix.os == 'macos-latest'
        run: scripts/phone-build.sh aarch64-apple-ios aarch64-apple-ios-sim
        shell: bash

  # The flight censuses, whole, on every platform, each night (ADR-149, amended). The synthetic
  # flights' census (M7.2a, ADR-280): every flight flown again, held to the committed census to the
  # three figures the platforms share. The clock offset between two logs of one flight (M7.2f,
  # ADR-312): held on two-logger and staged synthetic flights, on seeds of their own, to the
  # committed report. On every pull request they made `validate` and `examples` CI's slowest jobs, 20 to 30
  # minutes on Windows (issue #1018), so a pull request flies their slices (`validate`) and leaves
  # the whole to that night's run, and so does `scripts/gate.sh` on the Mac. They run optimized (the
  # `report-check` profile keeps the dev profile's assertions and overflow checks). Every set runs
  # on every platform, on one line each, on no condition but this job's, which a test in xtask
  # holds (`synthetic::tests`).
  census:
    name: census (${{ matrix.os }})
    needs: scope
    if: needs.scope.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: scripts/native-toolchain.sh
        shell: bash
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo run --locked --quiet --package xtask --profile report-check -- synthetic --check --sets tuning,a
      - run: cargo run --locked --quiet --package xtask --profile report-check -- synthetic --check --sets b,calibration
      - run: cargo run --locked --quiet --package xtask --profile report-check -- two-logs --check

  # The least-squares fit's 90% intervals (M7.3b, ADR-316): about 6,500 fits of flights of sets A
  # and B, each parameter held to ADR-257's counts and probes. In one Linux job it took 60 to 102 minutes
  # (eight runs, 2026-11-02). So eight jobs each fit an eighth of the flights: part K fits every
  # eighth flight of each run from the Kth (`fit --part K/8`), and hands its fits on. A fit doesn't
  # depend on what its thread or machine fitted before it (`fit::tests`), so the parts together are
  # the fits one job would make. The committed report and the shares are held exactly by
  # `scripts/gate.sh`, whole, on the platform that wrote them.
  fit-part:
    name: fit intervals (${{ matrix.part }}/8)
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    # Each night, with the censuses (ADR-149, amended; `scope`).
    needs: scope
    if: needs.scope.outputs.full == 'true'
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: scripts/native-toolchain.sh
        shell: bash
      - uses: Swatinem/rust-cache@v2
        with:
          # One cache for the parts and the job that checks them: the same optimized build.
          shared-key: fit-intervals
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.part == 1 }}
      - run: cargo run --locked --quiet --package xtask --profile report-check -- fit --part ${{ matrix.part }}/8 --out target/fit-parts
      - uses: actions/upload-artifact@v7
        with:
          name: fit-part-${{ matrix.part }}
          path: target/fit-parts
          if-no-files-found: error
          retention-days: 1

  # Passes only when every part passed. Then it puts the parts' fits back together, refusing a
  # part missing or there twice, parts of two splits and a flight not fitted once, and checks them
  # as one job would. Each night, with its parts; not after a cancelled run.
  fit-intervals:
    name: fit intervals
    needs: [scope, fit-part]
    if: ${{ !cancelled() && needs.scope.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Every part passed
        run: test "${{ needs.fit-part.result }}" = success
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: scripts/native-toolchain.sh
        shell: bash
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fit-intervals
          save-if: false
      - uses: actions/download-artifact@v8
        with:
          pattern: fit-part-*
          path: target/fit-parts
          merge-multiple: true
      - run: cargo run --locked --quiet --package xtask --profile report-check -- fit --check --other-platform --parts target/fit-parts

  doc:
    name: doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main saves: pull requests restore main's cache, and the repository stays under
          # GitHub's 10 GB cache limit instead of evicting main's entries.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --workspace --no-deps --all-features --locked

  # The evidence register (M2.10, ADR-278): the guide's pages, the register's schema and report,
  # and each row short of its wanted evidence held to an open `needs-sample` issue, which needs a
  # token that can read the issues. The samples it lists are under the gitignored refs/, so the
  # gate's refs step checks them, not CI.
  evidence:
    name: evidence
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main saves: pull requests restore main's cache, and the repository stays under
          # GitHub's 10 GB cache limit instead of evicting main's entries.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo run --locked --quiet --package xtask -- evidence

  wasm-check:
    name: wasm-check
    needs: scope
    # Not for a change to research notes alone (`scope`); skipped, it still passes by name.
    if: needs.scope.outputs.notes != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main saves: pull requests restore main's cache, and the repository stays under
          # GitHub's 10 GB cache limit instead of evicting main's entries.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `cargo xtask` without its alias, so the xtask build itself is --locked too.
      - run: cargo run --locked --quiet --package xtask -- wasm-check --locked

  # The workspace builds for Android (ADR-227); the iPhone build runs in `validate (macos-latest)`.
  # Build only: the tests run on phones when the mobile apps (M9.4) do.
  phone:
    name: phone (android)
    needs: scope
    # Not for a change to research notes alone (`scope`); skipped, it still passes by name.
    if: needs.scope.outputs.notes != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main saves: pull requests restore main's cache, and the repository stays under
          # GitHub's 10 GB cache limit instead of evicting main's entries.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: scripts/phone-build.sh aarch64-linux-android
        shell: bash

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          # deny.toml is written for this version; bump both together.
          tool: cargo-deny@0.20.2
      - run: cargo deny check

  # The site's checks run in three parts, one machine each: each builds the site and runs every
  # check but two, which take a third each: the layout check a third of the widths (`--widths
  # K/3`), and the vitals check a third of the pages; the canaries of both run in every part. The
  # layout check is most of the job's time and splits evenly by width.
  site-part:
    name: site (${{ matrix.part }}/3)
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main saves: pull requests restore main's cache, and the repository stays under
          # GitHub's 10 GB cache limit instead of evicting main's entries.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          # book.toml is written for this version (ADR-016); bump both together.
          tool: mdbook@0.5.4
      # Checks the pages' links and labels, builds the site with mdBook into target/site and the
      # workspace's rustdoc into target/site/api, checks every link in the built HTML, and checks
      # the pages' layout at this part's widths.
      - run: cargo run --locked --quiet --package xtask -- site --locked --widths ${{ matrix.part }}/3
      # The built site, packed as GitHub Pages takes it, from one part: each part builds the same
      # commit with the same mdBook and rustdoc, so their sites match. The deploy job publishes it
      # from main.
      - if: matrix.part == 1
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/site

  site:
    name: site
    needs: site-part
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only to ask whether GitHub Pages is on, below.
      pages: read
    outputs:
      pages: ${{ steps.pages.outputs.on }}
    steps:
      - name: Every part passed
        run: test "${{ needs.site-part.result }}" = success
      # Pages must be on, deploying from GitHub Actions, for the deploy job to work (ADR-019).
      # Until the owner turns it on, the site is built and checked but not deployed, and CI says
      # so with a warning rather than failing on main. Only main deploys, so only main asks.
      - name: Is GitHub Pages on?
        id: pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if source=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>"$RUNNER_TEMP/pages.err"); then
            :
          elif grep -q "HTTP 404" "$RUNNER_TEMP/pages.err"; then
            source=off
          else
            echo "::error::could not ask GitHub whether Pages is on: $(cat "$RUNNER_TEMP/pages.err")"
            exit 1
          fi
          if [[ $source == workflow ]]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "on=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=The site is not deployed::GitHub Pages is '$source'. Turn it on in Settings, Pages, Build and deployment, Source: GitHub Actions; the next run on main deploys."
          fi

  # Publishes the site and the API reference to GitHub Pages, from main only, and only once every
  # other check has passed on that commit, or was left out by a `scope` that passed. Not from the
  # nightly run.
  deploy:
    name: deploy
    needs: [fmt, clippy, test, examples, types, python, validate, fit-intervals, doc, evidence, wasm-check, phone, deny, site, scope]
    if: >-
      ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
      && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      && github.event_name != 'schedule' && needs.site.outputs.pages == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # A nightly run that fails, or in which a census didn't run, files one P-critical issue, or
  # comments on the one still open, so whatever broke a census is fixed before other work (ADR-149,
  # amended; ADR-144 §4). A run started by hand reports to whoever started it.
  nightly-alert:
    name: nightly alert
    needs: [scope, fmt, clippy, test, examples, types, python, validate, census, fit-intervals, doc, evidence, wasm-check, phone, deny, site]
    if: >-
      ${{ always() && github.event_name == 'schedule'
      && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
      || needs.census.result != 'success' || needs['fit-intervals'].result != 'success') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      NEEDS: ${{ toJSON(needs) }}
    steps:
      - run: |
          failed=$(jq -r 'to_entries[] | select(.value.result != "success")
            | "- `\(.key)`: \(.value.result)"' <<<"$NEEDS")
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          title="Nightly full checks failed on main"
          body=$(printf 'The nightly run on main at %s failed: %s\n\n%s\n' "${GITHUB_SHA:0:8}" "$run" "$failed")
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" \
            --json number --jq '.[0].number // empty')
          if [[ -n $open ]]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --label P-critical --label A-validation --body "$body"
          fi
