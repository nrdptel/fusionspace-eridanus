<text x="40" y="78" fill="#566079">by that much: simulated less logged, over logged, in bins of 5%.</text>
<text x="40" y="94" fill="#566079">The misses averaged +7.76%; 32 of 60 were within 10% either way (shaded).</text>
<text x="40" y="110" fill="#566079">The two outer bars hold every miss past 30% either way.</text>
