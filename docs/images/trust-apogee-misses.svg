<title id="title">HPR Sim&apos;s apogee against 60 logged flights</title>
<desc id="desc">Each bar counts the flights whose simulated apogee missed the logged one by that much: simulated less logged, over logged, in bins of 5%. The misses averaged +7.76%; 32 of 60 were within 10% either way (shaded). The two outer bars hold every miss past 30% either way.</desc>
