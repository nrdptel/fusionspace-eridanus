<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" font-family="'Cascadia Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#0B0F1C">
  <title>A rocket's flight from the pad to landing, seen from the side</title>
  <desc>The rocket lifts off the pad, leaves the rail, burns out, and coasts to apogee west of the pad, into the wind. It then drifts east under a drogue and a main parachute, and lands east of the pad. Seven numbered points mark the events.</desc>
  <!-- Colors are the light theme's roles of the FusionSpace product system (foundations.md, Rev A):
       canvas #F3F4F7, surface #FFFFFF, rule-strong and ink-muted #566079, ink #0B0F1C, predicted #A22488.
       Lines: the simulated flight dashed (8 4) in predicted, 2 px; references (the ground, the rail)
       chain lines (24 3 1 3), 1 px, the rail's offset so its dot shows between the balloons;
       balloons and the wind's arrow 1 px. -->
  <rect width="820" height="440" fill="#F3F4F7"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#566079"/>
    </marker>
  </defs>

  <!-- The wind, and what the lines mean -->
  <text x="30" y="32" fill="#566079">wind from the west</text>
  <line x1="30" y1="46" x2="150" y2="46" stroke="#566079" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="490" y="32" fill="#566079">Dashed: the simulated flight.</text>
  <text x="490" y="50" fill="#566079">Chain lines: the ground and the rail.</text>

  <!-- The ground and the rail: references, as chain lines -->
  <line x1="20" y1="390" x2="800" y2="390" stroke="#566079" stroke-width="1" stroke-dasharray="24 3 1 3"/>
  <text x="24" y="414" fill="#566079">west</text>
  <text x="796" y="414" fill="#566079" text-anchor="end">east</text>
  <text x="360" y="424" text-anchor="middle" fill="#566079">pad</text>
  <line x1="360" y1="390" x2="360" y2="352" stroke="#566079" stroke-width="1" stroke-dasharray="24 3 1 3" stroke-dashoffset="8.5"/>

  <!-- The flight, simulated: dashed, in the predicted color -->
  <g fill="none" stroke="#A22488" stroke-width="2" stroke-dasharray="8 4">
    <path d="M360,362 C358,320 345,285 330,250"/>
    <path d="M330,250 C322,160 285,100 250,70"/>
    <path d="M250,70 C300,110 380,220 430,338"/>
    <path d="M430,338 C438,360 447,375 455,390"/>
  </g>

  <!-- The phases -->
  <text x="346" y="382" text-anchor="end">on the rail</text>
  <text x="338" y="316" text-anchor="end">powered flight</text>
  <text x="290" y="160" text-anchor="end">coast</text>
  <text x="362" y="184">under the drogue</text>
  <text x="454" y="364">under the main</text>

  <!-- The events on the path, as numbered balloons -->
  <g text-anchor="middle">
    <circle cx="360" cy="390" r="10" fill="#FFFFFF" stroke="#0B0F1C" stroke-width="1"/><text x="360" y="394">1</text>
    <circle cx="360" cy="352" r="10" fill="#FFFFFF" stroke="#0B0F1C" stroke-width="1"/><text x="360" y="356">2</text>
    <circle cx="330" cy="250" r="10" fill="#FFFFFF" stroke="#0B0F1C" stroke-width="1"/><text x="330" y="254">3</text>
    <circle cx="250" cy="70" r="10" fill="#FFFFFF" stroke="#0B0F1C" stroke-width="1"/><text x="250" y="74">4</text>
    <circle cx="274" cy="92" r="10" fill="#FFFFFF" stroke="#0B0F1C" stroke-width="1"/><text x="274" y="96">5</text>
    <circle cx="430" cy="338" r="10" fill="#FFFFFF" stroke="#0B0F1C" stroke-width="1"/><text x="430" y="342">6</text>
    <circle cx="455" cy="390" r="10" fill="#FFFFFF" stroke="#0B0F1C" stroke-width="1"/><text x="455" y="394">7</text>
  </g>

  <!-- The legend -->
  <g text-anchor="middle">
    <circle cx="500" cy="96" r="10" fill="#FFFFFF" stroke="#0B0F1C" stroke-width="1"/><text x="500" y="100">1</text>
    <circle cx="500" cy="130" r="10" fill="#FFFFFF" stroke="#0B0F1C" stroke-width="1"/><text x="500" y="134">2</text>
    <circle cx="500" cy="164" r="10" fill="#FFFFFF" stroke="#0B0F1C" stroke-width="1"/><text x="500" y="168">3</text>
    <circle cx="500" cy="198" r="10" fill="#FFFFFF" stroke="#0B0F1C" stroke-width="1"/><text x="500" y="202">4</text>
    <circle cx="500" cy="232" r="10" fill="#FFFFFF" stroke="#0B0F1C" stroke-width="1"/><text x="500" y="236">5</text>
    <circle cx="500" cy="266" r="10" fill="#FFFFFF" stroke="#0B0F1C" stroke-width="1"/><text x="500" y="270">6</text>
    <circle cx="500" cy="300" r="10" fill="#FFFFFF" stroke="#0B0F1C" stroke-width="1"/><text x="500" y="304">7</text>
  </g>
  <text x="518" y="100">Liftoff: it starts up the rail</text>
  <text x="518" y="134">Rail exit: the rocket flies free</text>
  <text x="518" y="168">Burnout: the thrust curve ends</text>
  <text x="518" y="202">Apogee: the drogue's charge fires</text>
  <text x="518" y="236">The drogue opens, after its lag</text>
  <text x="518" y="270">The main opens, after its height and lag</text>
  <text x="518" y="304">Landing: back at the pad's height</text>
</svg>
