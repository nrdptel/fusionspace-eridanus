<svg xmlns="http://www.w3.org/2000/svg" width="720" height="542" viewBox="0 0 720 542" font-family="'Cascadia Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" role="img" aria-labelledby="title" aria-describedby="desc">
<title id="title">The guides&apos; rocket&apos;s flutter speed by fin thickness</title>
<desc id="desc">HPR Sim&apos;s flutter speed at the launch site (line), by Martin&apos;s criterion, for the rocket&apos;s birch plywood fin outline at each thickness. Shaded: Martin&apos;s band, where his line between wings that fluttered and wings that didn&apos;t falls. Dash-dot line: the rocket&apos;s top speed on the faster of its motors.</desc>
