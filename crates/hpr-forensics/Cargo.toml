[package]
name = "fusionspace-hpr-forensics"
description = "Flight against simulation: residuals, parameter identification and fault diagnosis."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

# The library keeps its Rust name, `hpr_forensics`, under the package's FusionSpace name (ADR-199).
[lib]
name = "hpr_forensics"

[lints]
workspace = true

# Pure crate: no I/O, and it must build for wasm32-unknown-unknown (`cargo xtask wasm-check`).
[package.metadata.hpr]
wasm = true

[dependencies]
hpr-flightdata.workspace = true
hpr-sim.workspace = true
hpr-analysis.workspace = true
# The synthetic flights (M7.2a): the designs, their motors and drag, the site's air and frame.
hpr-aero.workspace = true
hpr-atmos.workspace = true
hpr-core.workspace = true
hpr-design.workspace = true
hpr-motor.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
