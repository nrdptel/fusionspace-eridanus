[package]
name = "fusionspace-hpr-format"
description = "The HPR open design format: types, JSON Schema, versioning and migrations, and the container."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The library keeps its Rust name, `hpr_format`, under the package's FusionSpace name (ADR-199).
[lib]
name = "hpr_format"

[lints]
workspace = true

# Pure crate: no I/O, and it must build for wasm32-unknown-unknown (`cargo xtask wasm-check`).
[package.metadata.hpr]
wasm = true

[dependencies]
base64.workspace = true
# The provenance names the program, its version and its designation (`hpr_core::tool`).
hpr-core.workspace = true
hpr-design.workspace = true
# The document holds a design as `hpr_io::ork` reads it (ADR-111).
hpr-io.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
# Attachment names are compared in canonical decomposition, so two spellings of one accent meet.
unicode-normalization.workspace = true
# The `.hprz` container is a zip archive, written and read in memory.
zip.workspace = true

[dev-dependencies]
hpr-motor.workspace = true
hpr-sim.workspace = true
jsonschema.workspace = true
