[package]
name = "fusionspace-hpr-flightdata"
description = "Flight-log importers, filtering and smoothing, time alignment, parameter identification and fault diagnosis."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

# The library keeps its Rust name, `hpr_flightdata`, under the package's FusionSpace name (ADR-199).
[lib]
name = "hpr_flightdata"

[lints]
workspace = true

# Pure crate: no I/O, and it must build for wasm32-unknown-unknown (`cargo xtask wasm-check`).
#
# `forbids` is the layering rule of ADR-046: analyzing a flight log is a use of this project in
# its own right, so nothing here may need the simulator. Readings that compare a flight with a
# simulation of it belong in `hpr-forensics`. `hpr-atmos` is here because a few readings (Mach
# number, dynamic pressure, pressure altitude) are meaningless without an atmosphere.
[package.metadata.hpr]
wasm = true
forbids = ["fusionspace-hpr-sim"]

[dependencies]
hpr-core.workspace = true
hpr-atmos.workspace = true
# KML's and GPX's XML (M7.1c1, M7.1d1); it refuses a document type declaration, so no entity
# can expand.
roxmltree.workspace = true
# The sheets and shared strings of `.xlsx` workbooks (M7.1c14), read as a stream.
quick-xml.workspace = true
# The JSON Schemas of a column mapping, a record layout and the record (M7.1d2), as hpr-design's.
schemars.workspace = true
serde.workspace = true
# A mapping's or a layout's JSON refused by the field it fails (M7.1d2).
serde_path_to_error.workspace = true
# The JSON head of AltOS's `.eeprom` downloads (M7.1c10).
serde_json.workspace = true
thiserror.workspace = true
# Zip archives of a flight's files (M7.1c7), unpacked in memory within a bound; deflate only.
zip.workspace = true
# Only to choose the zip reader's deflate backend: the pure-Rust one, so wasm32 still builds.
flate2.workspace = true

[dev-dependencies]
insta.workspace = true
proptest.workspace = true
# The GPX tests check that gpxpy's reading is of the samples' very bytes (M7.1d1).
sha2.workspace = true
