# The `fusionspace-hpr` Python package, imported as `fusionspace.hpr` (ADR-199 §2), built from this
# crate by maturin: `maturin build --release` here, or `maturin develop` into a virtual
# environment. One abi3 wheel per operating system serves CPython 3.10 and later. Nothing is
# published yet: releases are the maintainer's (CONTRIBUTING.md rule 7).
[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "fusionspace-hpr"
description = "A flight simulator for hobby and high-power rockets."
readme = "README.md"
requires-python = ">=3.10"
license = "(MIT OR Apache-2.0) AND Apache-2.0"
dependencies = ["numpy>=1.22"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Physics",
]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Documentation = "https://hpr.fusionspace.co/python.html"
Repository = "https://github.com/nrdptel/fusionspace-eridanus"

[tool.maturin]
# `fusionspace` is an implicit namespace package (PEP 420): `python/fusionspace/` has no
# `__init__.py`, so other FusionSpace packages can install beside this one, as `google.cloud`'s do.
module-name = "fusionspace.hpr._hpr"
python-source = "python"
# Bytecode caches from running the tests against `maturin develop` stay out of the wheel.
exclude = ["python/**/__pycache__/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
