# calisto-tests-motor-at-minus-1.373-calm: the rocket, rail, site and declared drag of
# `flight-calisto-tests-motor-at-minus-1.373.toml`, flown by both codes with no wind
# (`validation/oracles/rocketpy/flight.py`, `CALM_AIR_BASES`; M2.1d2, issue #50).
#
# Everything that case's header says about the metrics, the rail and the sources of the remaining
# differences holds here. What differs: with no wind, the horizontal path comes only from the
# rail's inclination and heading, so the apogee and landing drifts are scored at the milestone's 3%
# like every other metric (its acceleration time is not scored, for its windy case's reason).
# The speeds are held to 0.2% and the apogee to 0.5% (ADR-289), and the rail-exit time to 0.5%, the
# apogee time to 1%, the burnout height to 0.2% and the two traces to 1% and 0.5% of their scales
# (ADR-294), and the largest Mach number and the largest acceleration, under power and over the
# whole flight, to 1% (ADR-303): many times RocketPy's own solver noise and still several times the
# largest difference measured in any of these flights.
# In wind, where the two codes' normal force differs at the rail exit's angle of attack, some
# drifts are reported as measured model differences (ADR-026); these cases fly the same rockets
# without it.

id = "flight-calisto-tests-motor-at-minus-1.373-calm"
title = "Calisto, RocketPy's test rocket, from the pad to the ground in calm air, same-drag"
reference = "validation/fixtures/flight/rocketpy-whole-flight.json"
reference_case = "calisto-tests-motor-at-minus-1.373-calm"

[flight.whole_flight]
design = "rocketpy-calisto-tests-motor-at-minus-1.373"
configuration = "example"

[metrics.apogee_agl_m]
relative = 0.005

[metrics.apogee_time_s]
relative = 0.01

[metrics.max_speed_m_s]
relative = 0.002

[metrics.max_mach]
relative = 0.01

[metrics.max_acceleration_m_s2]
relative = 0.01

[metrics.max_acceleration_time_s]
not_scored = "as in the windy case, whose figures these are (in calm air RocketPy's later peak is 112.27 m/s^2 at 1.568 s): two peaks 0.9% apart in RocketPy: 111.18 m/s^2 on the rail at 0.05 s and 112.26 at 1.568 s, so its maximum is the later one; hpr's rail equation adds 1.16 m/s^2 of variable-mass terms at 0.05 s (thrust and mass equal to five digits), which lifts that peak to 112.35 and moves the maximum's time from one peak to the other. The size is gated."

[metrics.max_acceleration_power_on_m_s2]
relative = 0.01

[metrics.rail_exit_speed_m_s]
relative = 0.002

[metrics.rail_exit_time_s]
relative = 0.005

[metrics.burnout_altitude_agl_m]
relative = 0.002

[metrics.burnout_speed_m_s]
relative = 0.002

[metrics.flight_time_s]
relative = 0.03

[metrics.apogee_drift_m]
relative = 0.03

[metrics.landing_drift_m]
relative = 0.03

[metrics.impact_speed_m_s]
relative = 0.002

# The time-series RMS (M2.1d1): hpr's height and speed at the reference's 120 series times, from
# ignition until hpr lands, less RocketPy's; the reference value is 0, exact agreement. The height
# is held (gated) to 1% of the reference's apogee (2614.3 m) and the speed to 0.5% of its max speed
# (243.7 m/s), rounded down to 0.1 m and 0.01 m/s (ADR-294). Until then each was held to 3% of its
# scale: M2.1's 3% for a point metric, applied to a whole trace.
[metrics.series_height_rms_m]
absolute = 26.1

[metrics.series_speed_rms_m_s]
absolute = 1.21
