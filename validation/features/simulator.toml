# The simulator guide's comparison (M0.8a3, ADR-248): what HPR Sim and the comparable
# simulators each do, one capability a row. `cargo xtask guides` writes it into
# docs/simulator-compared.md, and `cargo xtask scoreboard` counts each tool's yes cells into the
# scoreboard's features row.
#
# Each tool other than HPR Sim names the release whose documentation was read, when it came out,
# the date it was read and its pages. Each cell says yes, partly or no: another tool's names the
# page that shows it, and a partly or a no says in a note what that page shows instead; HPR Sim's
# yes names the page of this site that covers it, its partly that page and the open milestone
# that brings the rest, its no the milestone. A yes says a tool can do a thing, never how well.

[[tool]]
id = "hpr"
name = "HPR Sim"

