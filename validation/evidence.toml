wanted = "real"
not_checked = "a measured pressure drag of a tangent ogive past Mach 1, including between Mach 1 and 1.3, committed as data with a test that scores HPR Sim's nose against it"
issue = 616

[[row.searched]]
on = "2026-10-16"
looked = [
  "NASA TR R-100 (Stoney, 1961), for a tangent ogive among its fineness-3 noses",
  "NACA Report 1386 (Perkins, Jorgensen and Sommer) and NACA TN 3716 (Perkins and Jorgensen), for measured pressures on tangent ogives",
  "AFATL-TR-77-8 (Butler, Sears and Pallas, 1977)",
  "NACA Report 1306, NACA TN 2250 and NACA TN 2399",
]
found = "four NACA and Air Force reports that give a tangent ogive's pressure drag past Mach 1.3, one of them, NACA Report 1386, with a point at Mach 1.24 too; TR R-100 holds no ogive. They are read in docs/research/ogive-wave-drag.md, with the note's own arithmetic to take friction out, and none is committed as data yet"

[[row.searched]]
on = "2026-11-22"
looked = [
