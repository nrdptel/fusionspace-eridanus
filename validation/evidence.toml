# The evidence register (M2.10, ADR-278): one row for each gap the guide states in what backs a
# reader, a model or a check. `cargo xtask evidence` holds it to the pages and writes its report
# into docs/evidence.md; its schema is schema/validation/evidence.schema.json.
#
# Each row names its surface, the claim, the guide's pages that state the gap (each links the row as
# `evidence.md#g<n>`), the kind of evidence behind it and the kind that would settle it. A kind is
# one of: real (a file or measurement from the device or flight itself), sibling (a real file from a
# related device or firmware), code-to-code (another program's answer), spec (built from a published
# layout or schema), calibration (checked against the data it was fitted to, or seen while it was
# chosen), reasoning (an argument only) or none. Every row wants real unless `wanted_adr` names the
# decision record that sets less. A row short of its wanted kind says what is not checked and names
# its open issue, labeled needs-sample, which closes only when the row reaches its wanted kind. A
# real row lists each sample under refs/ with its SHA-256, its license and the test that reads it.
# `searched` keeps where a search for better evidence looked and what it found, so the next one
# doesn't repeat it: `looked` lists each place (a site, an archive, a search or a collection) as a
# short phrase of its own, and `found` is short sentences, the first going on from "It found".
#
# `as_of` is the date the report counts a row's last search from: a row with no search, or whose
# last is over 30 days before it, is due one.

as_of = "2026-10-20"

