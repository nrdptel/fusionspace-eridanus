  "the CORE and arXiv indexes, for supersonic ogive drag",
  "a web search of DTIC and J-STAGE for tangent-ogive pressures at Mach 1.1 to 1.2",
]
found = "nothing new: a Princeton Mach 3 tangent-ogive report (DTIC ADA065131) has its pressure taps on the cylinder only, and AEDC-TR-76-161's forebody drag from Mach 0.6 to 1.4 is of a fighter-shaped body"

[[row]]
id = "G41"
surface = "Aerodynamics"
claim = "Below Mach 0.8 a base behind a boattail keeps d_B/d of the flat-base drag, changed on one missile model's measured free flight"
pages = [
  "physics/aero.md#boattails-faster-than-sound",
  "accuracy.md#the-base-under-power-against-a-measured-flight",
]
kind = "sibling"
wanted = "real"
not_checked = "a measured base drag behind a hobby rocket's boattail below Mach 0.8; the one flight checked, the Hermes A-3A drag model's, has a long 4.5° cone and is not a hobby rocket"
issue = 1572

[[row.searched]]
on = "2026-11-20"
looked = [
  "NASA TR R-100 (Stoney, 1961) and Hoerner's Fluid-Dynamic Drag (1965), for a subsonic rule for the base behind a boattail",
  "NACA RM E54I13 (Salmi) and NACA RM L51L03 (Stoney), for measured base pressures behind cones held without a rear sting",
]
found = "a rule and three measurements. TR R-100 gives the base drag of a conical afterbody as the cylinder's times (r_b/R) cubed on the largest cross-section, and Hoerner's eq. 35 has the same dependence. Salmi's jet-off base pressures behind 5.6° cones at Mach 0.9 and Stoney's free-flight body from Mach 0.6 to 0.85, read by eye, both put the base drag below that rule, as the Hermes A-3A's flight does. None is a hobby rocket"

[[row.searched]]
on = "2026-11-22"
looked = [
  "archive.org's mirror of DTIC reports, by boattail, base-pressure and strut-support titles",
  "a web search for subsonic boattail base drag of model rockets in tunnel tests and theses",
  "the TU Delft repository, for rocket base flow",
]
found = "Rubin, MICOM RD-TR-71-17 (1971; DTIC AD0730669; US Government work, approved for public release): a 2.5 in body with an ogive nose and boattails, held on a swept side strut so there is no sting at the base. Its Fig. 17 gives boattail base pressure at Mach 0.7, 0.9, 1.0 and 1.2, jet off included, as plots. A dummy nozzle sits in the base, and it is a tunnel model, not a hobby rocket's flight"
