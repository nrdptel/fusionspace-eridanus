[[row.searched]]
on = "2026-11-02"
looked = [
  "GitHub code search for CZML files with rocket words (316 hits) and with apogee or altimeter (none)",
  "GitHub code search for glTF binaries of a rocket's flight path (none)",
]
found = "no other program's CZML or glTF of a real rocket flight to set beside a ghost file. The CZML hits are Cesium demos and satellite orbits. A look in Cesium still needs a person"

[[row]]
id = "G38"
surface = "The least-squares fit"
claim = "Each of the drag scale, impulse scale, wind on logs with a track, and mass has a 90% interval tested on two sets of synthetic flights, seen while its model was chosen. All pass on both sets but the drag scale's on set B, which fails on its lower tail: too many truths lie below it, so its fitted drag reads high there"
pages = ["physics/flight-fit.md#in-short", "fitting-a-flight.md#what-it-leaves-out", "accuracy.md#where-each-model-stands"]
kind = "calibration"
wanted = "real"
not_checked = "a real flight's fit against what was measured apart from the log: a weighed mass, a static test's impulse, a measured wind. Nor that a log with a track holds no second answer in the wind that the fit's scan misses, between its points or past 12 m/s: the scan found the one a test showed (ADR-382)"
issue = 1104

[[row.searched]]
on = "2026-11-02"
looked = [
  "NASA Student Launch post-launch reports, by a web search",
  "Florida State University Panama City's 2026 post-launch report (no terms stated)",
  "Zenodo, Dryad and Hugging Face for rocket flight data",
]
found = "a lead with no log. The Florida State report states the launch-ready vehicle's final mass, its sections' weights, the wind speed and a TeleMetrum's apogee, but publishes no log or motor test. It is cited only, cached under refs/samples-search/G38. The data sites hold no flight log with a weighed mass, a static test or a measured wind"

