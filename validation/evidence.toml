found = "candidates, US government work, public use permitted. RM A52E22 tabulates lift, drag and moment against angle (tables V to VIII) for 3/4-power and 1/2-power blunt bodies of fineness 3 and 5. They're at Mach 2.75 to 5.00, blunt tips that aren't sphere-cones. RM E54B11's table I gives pressure coefficients by meridian at 3° and 9° over four boattails at Mach 3.12. The boattail's own share of the normal force can be integrated from it, though the project uses it only for drag. TM X-653's blunted nose is another sphere-cone"

