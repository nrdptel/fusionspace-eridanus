found = "candidates, all US government work, public use permitted: TM X-653 measured normal-force slope and center of pressure of sharp and blunted cone-cylinders with 10° and 20° conical flares from Mach 0.60 to 5.82 (figs. 4 and 6), its 20° flare separating at Mach 1.20 and 1.37 (fig. 7), below the speed where a 20° wedge's shock attaches, so it covers a flare past its corner's limit; TM X-30 gives flare-alone normal-force slopes and centers for 80 cone-cylinder-flare bodies with flares of 5° to 20° at Mach 2.18, 2.81 and 4.04 beside the second-order shock-expansion method; RM A57I30 measures flares at Mach 3.0 to 6.3; RM L57J29 has no force data. The Redstone reports 6R3P, 6R3N2 and 6R3N1 were not found online"

