]
found = "Washington and Humphrey, MICOM RD-TM-69-11 (1969; DTIC AD0699359; US Government work, approved for public release): tabulated surface pressures at angle of attack, Mach 1.75 to 4.5, on 4°, 6° and 8° conical flares behind a cone-cylinder, which integrate to a normal force. A second measured flare; none is past its corner's limit"

