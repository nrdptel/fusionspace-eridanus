claim = "Martin's flutter criterion (NACA TN 4197) places a fin against the line his missile and wind-tunnel wings drew"
pages = ["physics/flutter.md#in-short"]
kind = "spec"
wanted = "real"
not_checked = "a hobby rocket's flutter, against which nothing here is checked; that the result errs on the safe side, which nothing shows; a fin glued to a tube, less stiff at its root than Martin's clamped wings"
issue = 675

[[row.searched]]
on = "2026-10-17"
looked = "web searches for measured flutter of hobby-size fins (wind tunnel, ground test, logged failure); Cal Poly's 2013 Fin Flutter Analysis (digitalcommons.calpoly.edu/aerosp/109); a 2008 WPI project report; Dinulović et al., FME Transactions 50(3) 2022 and Aerospace 11(1) 2024 (doi 10.3390/aerospace11010026); the same group's Materials 2025 test of 3D-printed PLA plates, cited in the hardware line's note"
found = "a candidate: Dinulović, Rašuo, Slavković and Zajić, 'Flutter Analysis of Tapered Composite Fins: Analysis and Experiment', FME Transactions 50 (2022) 576 to 585, Table 4, p. 583: five clamped e-glass fins, 0.65 mm (0.026 in) thick, 180 mm (7.1 in) root, 90 mm (3.5 in) tip, 262 mm (10.3 in) span, fluttered at 19.6 to 21.5 m/s (64 to 71 ft/s) in a wind tunnel, where TN 4197's speed as the paper evaluates it (thickness over the mean chord, an effective shear modulus of 7.96 GPa) is 15.3 m/s (50 ft/s), 21.9% to 28.8% below; HPR Sim's reading, thickness over the root chord, gives about 10.7 m/s (35 ft/s) at sea level on that modulus, 45% to 50% below; both on the safe side for the speed, on that one fin, which is not yet scored by HPR Sim's deciding check (Martin's figure 3); copyright the Faculty of Mechanical Engineering, Belgrade, all rights reserved, so cite only. Its fins are clamped plates at low speed, not fins glued to a tube. The Materials 2025 plates, which fluttered at about 10 to 12 m/s (33 to 39 ft/s), come from the same group, so not an independent test. The Cal Poly report found no measured flutter speed, the WPI report says flutter was not tested, and the 2024 Aerospace article (CC BY) could not be reached (HTTP 403)"

