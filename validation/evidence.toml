found = "a partial answer: the Vega paper (§2.4, p. 3) says its one-axis Kalman filter trusts the IMU most during the burn. As the speed falls in the coast, the filter weights the barometer more, so a Vega height near apogee rests mostly on its barometer. The euroc23 ground-station CSVs give only altitude and velocity, and the raw .cfl logs' layout is published only in GPL code. EPFLRocketTeam/BellaLui (no license, cite only) has driver folders for a BME280 barometer and a BNO055 IMU on the 2020 flight computer. Nothing says which made the logged height; no fin-edge drawings were found for any of the four"

[[row]]
id = "G22"
surface = "Fin flutter"
claim = "Martin's flutter criterion (NACA TN 4197) places a fin against the line his missile and wind-tunnel wings drew"
pages = ["physics/flutter.md#in-short"]
kind = "spec"
wanted = "real"
