[[row.searched]]
on = "2026-10-17"
looked = [
  "NTRS, for reports on flared bodies",
  "NASA TM X-653 (Jorgensen, Spahr and Hill, 1962)",
  "NASA TM X-30 (Kirk and Chapman, 1959)",
  "NACA RM A57I30 (Dennis, 1957)",
  "NACA RM L57J29 (Kehlet, 1958)",
  "the Redstone Arsenal reports TM X-30 draws on",
]
found = "candidates, all US government work, public use permitted. TM X-653 measured normal-force slope and center of pressure of sharp and blunted cone-cylinders with 10° and 20° conical flares. Its range is Mach 0.60 to 5.82 (figs. 4 and 6). Its 20° flare separated at Mach 1.20 and 1.37 (fig. 7), below the speed where a 20° wedge's shock attaches. So it covers a flare past its corner's limit. TM X-30 gives flare-alone normal-force slopes and centers for 80 cone-cylinder-flare bodies with flares of 5° to 20° at Mach 2.18, 2.81 and 4.04. It sets them beside the second-order shock-expansion method. RM A57I30 measures flares at Mach 3.0 to 6.3; RM L57J29 has no force data. The Redstone reports 6R3P, 6R3N2 and 6R3N1 weren't found online"

